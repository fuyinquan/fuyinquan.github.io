<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>720° 全景漫游</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
/* ========== 全局样式 ========== */
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: 'Microsoft YaHei', 'PingFang SC', sans-serif; overflow: hidden; background: #000; color: #fff; }
:root {
  --primary: #4a90d9;
  --primary-dark: #357abd;
  --bg-panel: rgba(15, 20, 30, 0.88);
  --bg-card: rgba(25, 32, 48, 0.92);
  --border: rgba(255,255,255,0.08);
  --text: #e8eaf0;
  --text-dim: #8892a4;
  --accent: #5cbaef;
  --danger: #e74c5e;
  --success: #45c77b;
  --radius: 10px;
  --shadow: 0 8px 32px rgba(0,0,0,0.45);
}

/* ========== 全景容器 ========== */
#panorama-container { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 0; }

/* ========== 顶部导航栏 ========== */
.top-bar {
  position: fixed; top: 0; left: 0; right: 0; z-index: 100;
  display: flex; align-items: center; justify-content: space-between;
  padding: 12px 24px;
  background: linear-gradient(180deg, rgba(0,0,0,0.7) 0%, transparent 100%);
  transition: opacity 0.3s;
}
.top-bar .logo { font-size: 20px; font-weight: 700; letter-spacing: 1px; }
.top-bar .logo span { color: var(--accent); }
.top-bar-actions { display: flex; gap: 8px; }

/* ========== 按钮通用样式 ========== */
.btn {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 8px 16px; border: none; border-radius: var(--radius);
  font-size: 13px; font-family: inherit; cursor: pointer;
  transition: all 0.25s; backdrop-filter: blur(12px);
}
.btn-icon {
  width: 40px; height: 40px; padding: 0;
  display: flex; align-items: center; justify-content: center;
  border-radius: 50%; font-size: 18px;
}
.btn-primary { background: var(--primary); color: #fff; }
.btn-primary:hover { background: var(--primary-dark); transform: translateY(-1px); }
.btn-ghost { background: rgba(255,255,255,0.1); color: #fff; }
.btn-ghost:hover { background: rgba(255,255,255,0.2); }
.btn-danger { background: var(--danger); color: #fff; }
.btn-danger:hover { background: #d43a4c; }
.btn-success { background: var(--success); color: #fff; }
.btn-success:hover { background: #38b56b; }

/* ========== 侧边场景列表 ========== */
.scene-sidebar {
  position: fixed; left: 0; top: 0; bottom: 0; width: 300px; z-index: 200;
  background: var(--bg-panel); backdrop-filter: blur(20px);
  transform: translateX(-100%); transition: transform 0.35s cubic-bezier(0.4,0,0.2,1);
  display: flex; flex-direction: column;
  border-right: 1px solid var(--border);
}
.scene-sidebar.open { transform: translateX(0); }
.sidebar-header {
  padding: 20px; display: flex; align-items: center; justify-content: space-between;
  border-bottom: 1px solid var(--border);
}
.sidebar-header h3 { font-size: 16px; font-weight: 600; }
.scene-list { flex: 1; overflow-y: auto; padding: 12px; }
.scene-item {
  display: flex; align-items: center; gap: 12px;
  padding: 12px; margin-bottom: 8px; border-radius: var(--radius);
  cursor: pointer; transition: all 0.2s; position: relative;
  border: 1px solid transparent;
}
.scene-item:hover { background: rgba(255,255,255,0.06); border-color: var(--border); }
.scene-item.active { background: rgba(92,186,239,0.12); border-color: var(--accent); }
.scene-thumb {
  width: 64px; height: 64px; border-radius: 8px; object-fit: cover;
  background: rgba(255,255,255,0.05); flex-shrink: 0;
}
.scene-info { flex: 1; min-width: 0; }
.scene-info h4 { font-size: 14px; margin-bottom: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.scene-info p { font-size: 12px; color: var(--text-dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.scene-delete {
  position: absolute; top: 8px; right: 8px; width: 24px; height: 24px;
  border-radius: 50%; background: rgba(231,76,94,0.15); color: var(--danger);
  border: none; cursor: pointer; font-size: 14px; display: none;
  align-items: center; justify-content: center;
}
.scene-item:hover .scene-delete { display: flex; }

/* ========== 底部控制栏 ========== */
.bottom-bar {
  position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); z-index: 100;
  display: flex; align-items: center; gap: 6px;
  padding: 8px 12px; border-radius: 50px;
  background: var(--bg-panel); backdrop-filter: blur(20px);
  border: 1px solid var(--border); box-shadow: var(--shadow);
}
.bottom-bar .divider { width: 1px; height: 24px; background: var(--border); margin: 0 4px; }

/* ========== 信息面板 ========== */
.info-panel {
  position: fixed; right: 20px; bottom: 80px; width: 340px; z-index: 150;
  background: var(--bg-panel); backdrop-filter: blur(20px);
  border-radius: 16px; border: 1px solid var(--border);
  box-shadow: var(--shadow); overflow: hidden;
  transform: translateY(20px); opacity: 0; pointer-events: none;
  transition: all 0.3s cubic-bezier(0.4,0,0.2,1);
}
.info-panel.open { transform: translateY(0); opacity: 1; pointer-events: auto; }
.info-panel-header {
  padding: 16px 20px; display: flex; align-items: center; justify-content: space-between;
  border-bottom: 1px solid var(--border);
}
.info-panel-header h3 { font-size: 15px; font-weight: 600; }
.info-panel-body { padding: 16px 20px; max-height: 300px; overflow-y: auto; }
.info-panel-body p { font-size: 13px; line-height: 1.8; color: var(--text-dim); }
.info-field { margin-bottom: 12px; }
.info-field label { display: block; font-size: 12px; color: var(--text-dim); margin-bottom: 4px; }
.info-field input, .info-field textarea {
  width: 100%; padding: 8px 12px; border-radius: 8px;
  border: 1px solid var(--border); background: rgba(255,255,255,0.06);
  color: var(--text); font-size: 13px; font-family: inherit;
  outline: none; transition: border-color 0.2s;
}
.info-field input:focus, .info-field textarea:focus { border-color: var(--accent); }
.info-field textarea { resize: vertical; min-height: 80px; }

/* ========== 地图面板 ========== */
.map-panel {
  position: fixed; right: 20px; top: 70px; width: 260px; height: 200px; z-index: 150;
  background: var(--bg-panel); backdrop-filter: blur(20px);
  border-radius: 16px; border: 1px solid var(--border);
  box-shadow: var(--shadow); overflow: hidden;
  transform: scale(0.9); opacity: 0; pointer-events: none;
  transition: all 0.3s cubic-bezier(0.4,0,0.2,1);
}
.map-panel.open { transform: scale(1); opacity: 1; pointer-events: auto; }
.map-panel-header {
  padding: 10px 14px; display: flex; align-items: center; justify-content: space-between;
  border-bottom: 1px solid var(--border); font-size: 13px; font-weight: 600;
}
#map-container { width: 100%; height: calc(100% - 40px); background: #1a1f2e; }
.map-dot {
  width: 12px; height: 12px; background: var(--accent); border-radius: 50%;
  position: absolute; transform: translate(-50%, -50%);
  box-shadow: 0 0 12px var(--accent); cursor: pointer;
  animation: pulse 2s infinite;
}
@keyframes pulse {
  0%, 100% { box-shadow: 0 0 8px var(--accent); }
  50% { box-shadow: 0 0 20px var(--accent), 0 0 40px rgba(92,186,239,0.3); }
}

/* ========== 音乐播放器 ========== */
.music-player {
  position: fixed; left: 20px; bottom: 80px; z-index: 150;
  background: var(--bg-panel); backdrop-filter: blur(20px);
  border-radius: 16px; border: 1px solid var(--border);
  box-shadow: var(--shadow); padding: 16px; width: 280px;
  transform: translateY(20px); opacity: 0; pointer-events: none;
  transition: all 0.3s cubic-bezier(0.4,0,0.2,1);
}
.music-player.open { transform: translateY(0); opacity: 1; pointer-events: auto; }
.music-player h4 { font-size: 13px; margin-bottom: 12px; font-weight: 600; }
.music-track { font-size: 12px; color: var(--text-dim); margin-bottom: 10px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.music-controls { display: flex; align-items: center; gap: 10px; }
.music-progress { flex: 1; height: 4px; background: rgba(255,255,255,0.1); border-radius: 2px; cursor: pointer; }
.music-progress-fill { height: 100%; background: var(--accent); border-radius: 2px; width: 0%; transition: width 0.1s; }
.volume-slider { width: 60px; height: 4px; -webkit-appearance: none; background: rgba(255,255,255,0.1); border-radius: 2px; outline: none; }
.volume-slider::-webkit-slider-thumb { -webkit-appearance: none; width: 12px; height: 12px; background: var(--accent); border-radius: 50%; cursor: pointer; }

/* ========== 后台管理面板 ========== */
.admin-overlay {
  position: fixed; inset: 0; z-index: 500;
  background: rgba(0,0,0,0.6); backdrop-filter: blur(8px);
  display: flex; align-items: center; justify-content: center;
  opacity: 0; pointer-events: none; transition: opacity 0.3s;
}
.admin-overlay.open { opacity: 1; pointer-events: auto; }
.admin-panel {
  width: 720px; max-width: 92vw; max-height: 85vh;
  background: var(--bg-card); border-radius: 20px;
  border: 1px solid var(--border); box-shadow: var(--shadow);
  display: flex; flex-direction: column; overflow: hidden;
}
.admin-header {
  padding: 20px 24px; display: flex; align-items: center; justify-content: space-between;
  border-bottom: 1px solid var(--border);
}
.admin-header h2 { font-size: 18px; font-weight: 700; }
.admin-body { flex: 1; overflow-y: auto; padding: 24px; }
.admin-section { margin-bottom: 24px; }
.admin-section h3 { font-size: 15px; font-weight: 600; margin-bottom: 12px; color: var(--accent); }
.upload-zone {
  border: 2px dashed var(--border); border-radius: 16px;
  padding: 40px; text-align: center; cursor: pointer;
  transition: all 0.3s; position: relative;
}
.upload-zone:hover { border-color: var(--accent); background: rgba(92,186,239,0.04); }
.upload-zone.dragover { border-color: var(--accent); background: rgba(92,186,239,0.08); }
.upload-icon { font-size: 48px; margin-bottom: 12px; }
.upload-text { font-size: 14px; color: var(--text-dim); }
.upload-text strong { color: var(--text); }

.admin-scene-list { display: grid; gap: 12px; }
.admin-scene-card {
  display: flex; align-items: center; gap: 16px;
  padding: 16px; border-radius: 12px;
  background: rgba(255,255,255,0.03); border: 1px solid var(--border);
  transition: all 0.2s;
}
.admin-scene-card:hover { background: rgba(255,255,255,0.06); }
.admin-scene-card img {
  width: 80px; height: 80px; border-radius: 10px; object-fit: cover;
  background: rgba(255,255,255,0.05);
}
.admin-scene-card .info { flex: 1; }
.admin-scene-card .info h4 { font-size: 14px; margin-bottom: 4px; }
.admin-scene-card .info p { font-size: 12px; color: var(--text-dim); }
.admin-scene-card .actions { display: flex; gap: 8px; }

/* ========== 分享弹窗 ========== */
.share-modal {
  position: fixed; inset: 0; z-index: 600;
  background: rgba(0,0,0,0.6); backdrop-filter: blur(8px);
  display: flex; align-items: center; justify-content: center;
  opacity: 0; pointer-events: none; transition: opacity 0.3s;
}
.share-modal.open { opacity: 1; pointer-events: auto; }
.share-content {
  width: 420px; max-width: 90vw;
  background: var(--bg-card); border-radius: 20px;
  border: 1px solid var(--border); box-shadow: var(--shadow);
  padding: 28px;
}
.share-content h3 { font-size: 18px; margin-bottom: 20px; text-align: center; }
.share-options { display: flex; flex-direction: column; gap: 10px; }
.share-option {
  display: flex; align-items: center; gap: 12px;
  padding: 12px 16px; border-radius: 12px;
  background: rgba(255,255,255,0.04); border: 1px solid var(--border);
  cursor: pointer; transition: all 0.2s;
}
.share-option:hover { background: rgba(255,255,255,0.08); }
.share-option .icon { font-size: 24px; width: 40px; text-align: center; }
.share-option .label { font-size: 14px; }
.share-option .label small { display: block; font-size: 11px; color: var(--text-dim); margin-top: 2px; }
.share-link-box {
  margin-top: 16px; padding: 12px; border-radius: 10px;
  background: rgba(255,255,255,0.04); border: 1px solid var(--border);
  display: flex; align-items: center; gap: 8px;
}
.share-link-box input {
  flex: 1; background: none; border: none; color: var(--text);
  font-size: 12px; outline: none;
}

/* ========== 加载动画 ========== */
.loading-overlay {
  position: fixed; inset: 0; z-index: 1000;
  background: #0a0e17;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  transition: opacity 0.5s;
}
.loading-overlay.hidden { opacity: 0; pointer-events: none; }
.loading-spinner {
  width: 48px; height: 48px; border: 3px solid rgba(255,255,255,0.1);
  border-top-color: var(--accent); border-radius: 50%;
  animation: spin 0.8s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
.loading-text { margin-top: 16px; font-size: 14px; color: var(--text-dim); }

/* ========== 提示 Toast ========== */
.toast {
  position: fixed; top: 80px; left: 50%; transform: translateX(-50%) translateY(-20px);
  z-index: 9999; padding: 10px 24px; border-radius: 50px;
  background: var(--bg-panel); backdrop-filter: blur(16px);
  border: 1px solid var(--border); font-size: 13px;
  opacity: 0; transition: all 0.3s; pointer-events: none;
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

/* ========== 指南针 ========== */
.compass {
  position: fixed; top: 70px; left: 20px; z-index: 100;
  width: 56px; height: 56px; border-radius: 50%;
  background: var(--bg-panel); backdrop-filter: blur(12px);
  border: 1px solid var(--border); display: flex; align-items: center; justify-content: center;
  font-size: 14px; font-weight: 700; color: var(--accent);
  transition: transform 0.1s;
}

/* ========== 陀螺仪提示 ========== */
.gyro-hint {
  position: fixed; bottom: 90px; left: 50%; transform: translateX(-50%);
  z-index: 80; font-size: 12px; color: var(--text-dim);
  opacity: 0; transition: opacity 1s; pointer-events: none;
}

/* ========== 遮罩层（侧边栏打开时） ========== */
.sidebar-overlay {
  position: fixed; inset: 0; z-index: 190;
  background: rgba(0,0,0,0.4);
  opacity: 0; pointer-events: none; transition: opacity 0.3s;
}
.sidebar-overlay.open { opacity: 1; pointer-events: auto; }

/* ========== 滚动条 ========== */
::-webkit-scrollbar { width: 4px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.15); border-radius: 2px; }
::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.25); }

/* ========== 响应式 ========== */
@media (max-width: 768px) {
  .scene-sidebar { width: 260px; }
  .admin-panel { width: 95vw; }
  .info-panel { width: 300px; right: 10px; bottom: 70px; }
  .music-player { width: 240px; left: 10px; bottom: 70px; }
  .map-panel { width: 200px; height: 160px; }
  .bottom-bar { padding: 6px 8px; gap: 4px; }
  .btn-icon { width: 36px; height: 36px; font-size: 16px; }
}
</style>
</head>
<body>

<!-- 加载动画 -->
<div class="loading-overlay" id="loadingOverlay">
  <div class="loading-spinner"></div>
  <div class="loading-text">正在加载全景...</div>
</div>

<!-- 提示 -->
<div class="toast" id="toast"></div>

<!-- 全景容器 -->
<div id="panorama-container"></div>

<!-- 指南针 -->
<div class="compass" id="compass">N</div>

<!-- 顶部导航 -->
<div class="top-bar" id="topBar">
  <div style="display:flex;align-items:center;gap:12px;">
    <button class="btn btn-icon btn-ghost" onclick="toggleSidebar()" title="场景列表">&#9776;</button>
    <div class="logo"><span>720°</span> 全景漫游</div>
  </div>
  <div class="top-bar-actions">
    <button class="btn btn-ghost" onclick="openAdmin()" title="后台管理">&#9881; 管理</button>
    <button class="btn btn-ghost" onclick="toggleFullscreen()" title="全屏">&#9974; 全屏</button>
  </div>
</div>

<!-- 侧边栏遮罩 -->
<div class="sidebar-overlay" id="sidebarOverlay" onclick="toggleSidebar()"></div>

<!-- 场景列表侧边栏 -->
<div class="scene-sidebar" id="sceneSidebar">
  <div class="sidebar-header">
    <h3>&#127912; 场景列表</h3>
    <button class="btn btn-icon btn-ghost" onclick="toggleSidebar()" style="width:32px;height:32px;font-size:16px;">&#10005;</button>
  </div>
  <div class="scene-list" id="sceneList"></div>
</div>

<!-- 底部控制栏 -->
<div class="bottom-bar" id="bottomBar">
  <button class="btn btn-icon btn-ghost" onclick="prevScene()" title="上一个场景">&#9664;</button>
  <button class="btn btn-icon btn-ghost" onclick="nextScene()" title="下一个场景">&#9654;</button>
  <div class="divider"></div>
  <button class="btn btn-icon btn-ghost" onclick="toggleAutoRotate()" id="btnAutoRotate" title="自动旋转">&#8635;</button>
  <button class="btn btn-icon btn-ghost" onclick="resetView()" title="重置视角">&#8962;</button>
  <div class="divider"></div>
  <button class="btn btn-icon btn-ghost" onclick="toggleMusic()" id="btnMusic" title="音乐">&#9835;</button>
  <button class="btn btn-icon btn-ghost" onclick="toggleMap()" id="btnMap" title="地图">&#9873;</button>
  <button class="btn btn-icon btn-ghost" onclick="toggleInfo()" id="btnInfo" title="简介">&#8505;</button>
  <div class="divider"></div>
  <button class="btn btn-icon btn-ghost" onclick="openShare()" title="分享">&#8599;</button>
</div>

<!-- 信息面板 -->
<div class="info-panel" id="infoPanel">
  <div class="info-panel-header">
    <h3 id="infoPanelTitle">场景简介</h3>
    <button class="btn btn-icon btn-ghost" onclick="toggleInfo()" style="width:28px;height:28px;font-size:14px;">&#10005;</button>
  </div>
  <div class="info-panel-body" id="infoPanelBody">
    <p>点击场景查看详情</p>
  </div>
</div>

<!-- 地图面板 -->
<div class="map-panel" id="mapPanel">
  <div class="map-panel-header">
    <span>&#128506; 场景地图</span>
    <button class="btn btn-icon btn-ghost" onclick="toggleMap()" style="width:24px;height:24px;font-size:12px;">&#10005;</button>
  </div>
  <div id="map-container" style="position:relative;">
    <svg id="mapSvg" width="100%" height="100%" viewBox="0 0 260 160">
      <rect width="260" height="160" fill="#1a1f2e"/>
      <text x="130" y="80" text-anchor="middle" fill="#556" font-size="12">地图加载中...</text>
    </svg>
  </div>
</div>

<!-- 音乐播放器 -->
<div class="music-player" id="musicPlayer">
  <h4>&#9835; 背景音乐</h4>
  <div class="music-track" id="musicTrackName">未选择音乐</div>
  <div class="music-controls">
    <button class="btn btn-icon btn-ghost" onclick="musicPrev()" style="width:28px;height:28px;font-size:14px;">&#9198;</button>
    <button class="btn btn-icon btn-primary" onclick="musicPlayPause()" id="btnMusicPlay" style="width:32px;height:32px;font-size:16px;">&#9654;</button>
    <button class="btn btn-icon btn-ghost" onclick="musicNext()" style="width:28px;height:28px;font-size:14px;">&#9197;</button>
    <div class="music-progress" onclick="musicSeek(event)">
      <div class="music-progress-fill" id="musicProgressFill"></div>
    </div>
    <input type="range" class="volume-slider" min="0" max="100" value="60" oninput="setVolume(this.value)" title="音量">
  </div>
</div>

<!-- 后台管理面板 -->
<div class="admin-overlay" id="adminOverlay">
  <div class="admin-panel">
    <div class="admin-header">
      <h2>&#9881; 后台管理</h2>
      <button class="btn btn-icon btn-ghost" onclick="closeAdmin()" style="width:32px;height:32px;">&#10005;</button>
    </div>
    <div class="admin-body">
      <!-- 添加全景 -->
      <div class="admin-section">
        <h3>&#10133; 添加全景场景</h3>
        <div class="upload-zone" id="uploadZone" onclick="document.getElementById('fileInput').click()">
          <div class="upload-icon">&#128247;</div>
          <div class="upload-text">
            <strong>点击上传</strong> 或拖拽全景图到此处<br>
            <small>支持 JPG / PNG 等格式的全景图片（等距柱状投影）</small>
          </div>
          <input type="file" id="fileInput" accept="image/*" multiple style="display:none" onchange="handleFileSelect(event)">
        </div>
      </div>
      <!-- 添加音乐 -->
      <div class="admin-section">
        <h3>&#9835; 背景音乐管理</h3>
        <div style="display:flex;gap:10px;align-items:center;margin-bottom:12px;">
          <button class="btn btn-primary" onclick="document.getElementById('musicInput').click()">&#10133; 添加音乐</button>
          <span style="font-size:12px;color:var(--text-dim)">支持 MP3 / WAV / OGG</span>
          <input type="file" id="musicInput" accept="audio/*" multiple style="display:none" onchange="handleMusicSelect(event)">
        </div>
        <div id="musicList" style="display:flex;flex-direction:column;gap:8px;"></div>
      </div>
      <!-- 场景管理 -->
      <div class="admin-section">
        <h3>&#128444; 场景管理</h3>
        <div class="admin-scene-list" id="adminSceneList"></div>
      </div>
    </div>
  </div>
</div>

<!-- 分享弹窗 -->
<div class="share-modal" id="shareModal">
  <div class="share-content">
    <h3>&#128279; 分享全景</h3>
    <div class="share-options">
      <div class="share-option" onclick="shareToWechat()">
        <div class="icon">&#128172;</div>
        <div class="label">微信<small>复制链接分享给好友</small></div>
      </div>
      <div class="share-option" onclick="shareToWeibo()">
        <div class="icon">&#128227;</div>
        <div class="label">微博<small>分享到微博</small></div>
      </div>
      <div class="share-option" onclick="shareToQQ()">
        <div class="icon">&#128101;</div>
        <div class="label">QQ<small>分享给QQ好友</small></div>
      </div>
      <div class="share-option" onclick="copyShareLink()">
        <div class="icon">&#128203;</div>
        <div class="label">复制链接<small>复制全景链接</small></div>
      </div>
    </div>
    <div class="share-link-box">
      <input type="text" id="shareLink" readonly>
      <button class="btn btn-primary" onclick="copyShareLink()" style="padding:6px 14px;font-size:12px;">复制</button>
    </div>
    <div style="margin-top:16px;text-align:center;">
      <button class="btn btn-ghost" onclick="closeShare()">关闭</button>
    </div>
  </div>
</div>

<script>
// ==================== 全局状态 ====================
const APP = {
  scenes: [],
  currentSceneIndex: 0,
  autoRotate: true,
  autoRotateSpeed: 0.001,
  isUserInteracting: false,
  lon: 0, lat: 0,
  onPointerDownLon: 0, onPointerDownLat: 0,
  onPointerDownX: 0, onPointerDownY: 0,
  fov: 75,
  musicPlaylist: [],
  currentMusicIndex: 0,
  isMusicPlaying: false,
  sidebarOpen: false,
  infoPanelOpen: false,
  mapPanelOpen: false,
  musicPlayerOpen: false,
  audioElement: null,
};

// ==================== 示例全景数据（使用在线等距柱状投影图） ====================
const DEMO_SCENES = [
  {
    id: 'demo1',
    name: '山间日出',
    description: '清晨的山谷，阳光穿透薄雾洒在连绵的山峰上，金色的光芒照亮了整片大地。站在山顶俯瞰，云海翻涌，令人心旷神怡。',
    imageUrl: '',
    thumbUrl: '',
    position: { x: 30, y: 40 },
  },
  {
    id: 'demo2',
    name: '古镇街巷',
    description: '青石板铺就的小巷，两旁是白墙黛瓦的徽派建筑，屋檐下挂着红灯笼，远处传来悠扬的笛声，仿佛穿越了千年时光。',
    imageUrl: '',
    thumbUrl: '',
    position: { x: 120, y: 60 },
  },
  {
    id: 'demo3',
    name: '星空银河',
    description: '高原上的夜空，银河横跨天际，繁星点点，流星划过。在这片纯净的星空下，感受宇宙的浩瀚与渺小。',
    imageUrl: '',
    thumbUrl: '',
    position: { x: 200, y: 100 },
  },
];

// ==================== Three.js 全景引擎 ====================
let camera, scene, renderer, sphere;
let raycaster, hotspots = [];

function initPanorama() {
  const container = document.getElementById('panorama-container');

  // 相机
  camera = new THREE.PerspectiveCamera(APP.fov, window.innerWidth / window.innerHeight, 0.1, 1100);
  camera.target = new THREE.Vector3(0, 0, 0);

  // 场景
  scene = new THREE.Scene();

  // 球体几何体（内贴图实现全景）
  const geometry = new THREE.SphereGeometry(500, 64, 40);
  geometry.scale(-1, 1, 1); // 翻转使纹理朝内

  // 程序化生成默认全景纹理
  const canvas = generatePanoramaCanvas('山间日出', '#1a3a5c', '#f0a050');
  const texture = new THREE.CanvasTexture(canvas);
  texture.mapping = THREE.EquirectangularReflectionMapping;

  const material = new THREE.MeshBasicMaterial({ map: texture });
  sphere = new THREE.Mesh(geometry, material);
  scene.add(sphere);

  // 渲染器
  renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setPixelRatio(window.devicePixelRatio);
  renderer.setSize(window.innerWidth, window.innerHeight);
  container.appendChild(renderer.domElement);

  // 事件监听
  setupControls();

  // 开始渲染
  animate();

  // 隐藏加载
  setTimeout(() => {
    document.getElementById('loadingOverlay').classList.add('hidden');
  }, 800);
}

// 程序化生成全景图（渐变色 + 文字标记）
function generatePanoramaCanvas(name, colorTop, colorBottom) {
  const w = 2048, h = 1024;
  const canvas = document.createElement('canvas');
  canvas.width = w; canvas.height = h;
  const ctx = canvas.getContext('2d');

  // 天空渐变
  const grad = ctx.createLinearGradient(0, 0, 0, h);
  grad.addColorStop(0, colorTop);
  grad.addColorStop(0.45, colorBottom);
  grad.addColorStop(0.55, colorBottom);
  grad.addColorStop(1, colorTop);
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, w, h);

  // 添加星星/装饰
  ctx.fillStyle = 'rgba(255,255,255,0.6)';
  for (let i = 0; i < 200; i++) {
    const x = Math.random() * w;
    const y = Math.random() * h * 0.4;
    const r = Math.random() * 2;
    ctx.beginPath();
    ctx.arc(x, y, r, 0, Math.PI * 2);
    ctx.fill();
  }

  // 地面网格
  ctx.strokeStyle = 'rgba(255,255,255,0.08)';
  ctx.lineWidth = 1;
  for (let i = 0; i < w; i += 64) {
    ctx.beginPath(); ctx.moveTo(i, h * 0.5); ctx.lineTo(i, h); ctx.stroke();
  }
  for (let j = h * 0.5; j < h; j += 32) {
    ctx.beginPath(); ctx.moveTo(0, j); ctx.lineTo(w, j); ctx.stroke();
  }

  // 场景名称
  ctx.fillStyle = 'rgba(255,255,255,0.9)';
  ctx.font = 'bold 72px Microsoft YaHei, sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText(name, w / 2, h * 0.42);

  ctx.fillStyle = 'rgba(255,255,255,0.4)';
  ctx.font = '28px Microsoft YaHei, sans-serif';
  ctx.fillText('720° 全景漫游 · 示例场景', w / 2, h * 0.52);

  // 方位标记
  const dirs = ['N', 'E', 'S', 'W'];
  ctx.font = 'bold 36px sans-serif';
  ctx.fillStyle = 'rgba(92,186,239,0.6)';
  dirs.forEach((d, i) => {
    ctx.fillText(d, (w / 4) * i + w / 8, h * 0.48);
  });

  return canvas;
}

// 加载全景图到球体
function loadPanorama(sceneData) {
  if (!sceneData) return;

  const loading = document.getElementById('loadingOverlay');
  loading.classList.remove('hidden');

  if (sceneData.imageUrl) {
    const loader = new THREE.TextureLoader();
    loader.load(sceneData.imageUrl, (texture) => {
      texture.mapping = THREE.EquirectangularReflectionMapping;
      sphere.material.map = texture;
      sphere.material.needsUpdate = true;
      loading.classList.add('hidden');
    }, undefined, () => {
      // 加载失败时使用程序化纹理
      const colors = [['#1a3a5c','#f0a050'],['#2d1b4e','#e74c5e'],['#0a2a3c','#45c77b'],['#3a1a2c','#f0c050']];
      const c = colors[APP.currentSceneIndex % colors.length];
      const canvas = generatePanoramaCanvas(sceneData.name, c[0], c[1]);
      const texture = new THREE.CanvasTexture(canvas);
      texture.mapping = THREE.EquirectangularReflectionMapping;
      sphere.material.map = texture;
      sphere.material.needsUpdate = true;
      loading.classList.add('hidden');
    });
  } else {
    const colors = [['#1a3a5c','#f0a050'],['#2d1b4e','#e74c5e'],['#0a2a3c','#45c77b'],['#3a1a2c','#f0c050']];
    const c = colors[APP.currentSceneIndex % colors.length];
    const canvas = generatePanoramaCanvas(sceneData.name, c[0], c[1]);
    const texture = new THREE.CanvasTexture(canvas);
    texture.mapping = THREE.EquirectangularReflectionMapping;
    sphere.material.map = texture;
    sphere.material.needsUpdate = true;
    setTimeout(() => loading.classList.add('hidden'), 400);
  }

  updateInfo();
  updateMap();
  updateSceneList();
}

// ==================== 交互控制 ====================
function setupControls() {
  const el = renderer.domElement;

  el.addEventListener('pointerdown', (e) => {
    APP.isUserInteracting = true;
    APP.onPointerDownX = e.clientX;
    APP.onPointerDownY = e.clientY;
    APP.onPointerDownLon = APP.lon;
    APP.onPointerDownLat = APP.lat;
  });

  el.addEventListener('pointermove', (e) => {
    if (!APP.isUserInteracting) return;
    APP.lon = (APP.onPointerDownX - e.clientX) * 0.15 + APP.onPointerDownLon;
    APP.lat = (e.clientY - APP.onPointerDownY) * 0.15 + APP.onPointerDownLat;
  });

  el.addEventListener('pointerup', () => { APP.isUserInteracting = false; });

  el.addEventListener('wheel', (e) => {
    APP.fov += e.deltaY * 0.05;
    APP.fov = Math.max(30, Math.min(100, APP.fov));
    camera.fov = APP.fov;
    camera.updateProjectionMatrix();
  });

  // 触摸支持
  let touchStartX, touchStartY;
  el.addEventListener('touchstart', (e) => {
    if (e.touches.length === 1) {
      APP.isUserInteracting = true;
      touchStartX = e.touches[0].clientX;
      touchStartY = e.touches[0].clientY;
      APP.onPointerDownLon = APP.lon;
      APP.onPointerDownLat = APP.lat;
    }
  }, { passive: true });

  el.addEventListener('touchmove', (e) => {
    if (!APP.isUserInteracting || e.touches.length !== 1) return;
    APP.lon = (touchStartX - e.touches[0].clientX) * 0.2 + APP.onPointerDownLon;
    APP.lat = (e.touches[0].clientY - touchStartY) * 0.2 + APP.onPointerDownLat;
  }, { passive: true });

  el.addEventListener('touchend', () => { APP.isUserInteracting = false; });

  window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });

  // 键盘
  document.addEventListener('keydown', (e) => {
    switch(e.key) {
      case 'ArrowLeft': APP.lon -= 5; break;
      case 'ArrowRight': APP.lon += 5; break;
      case 'ArrowUp': APP.lat += 5; break;
      case 'ArrowDown': APP.lat -= 5; break;
      case 'f': case 'F': toggleFullscreen(); break;
      case 'Escape': closeAllPanels(); break;
    }
  });
}

function animate() {
  requestAnimationFrame(animate);

  // 自动旋转
  if (APP.autoRotate && !APP.isUserInteracting) {
    APP.lon += APP.autoRotateSpeed * 50;
  }

  APP.lat = Math.max(-85, Math.min(85, APP.lat));

  const phi = THREE.MathUtils.degToRad(90 - APP.lat);
  const theta = THREE.MathUtils.degToRad(APP.lon);

  camera.target.x = 500 * Math.sin(phi) * Math.cos(theta);
  camera.target.y = 500 * Math.cos(phi);
  camera.target.z = 500 * Math.sin(phi) * Math.sin(theta);

  camera.lookAt(camera.target);
  renderer.render(scene, camera);

  // 更新指南针
  updateCompass();
}

// ==================== 指南针 ====================
function updateCompass() {
  const compass = document.getElementById('compass');
  const deg = ((APP.lon % 360) + 360) % 360;
  compass.style.transform = `rotate(${-deg}deg)`;

  const dirs = ['N', 'NE', 'E', 'SE', 'S', 'SW', 'W', 'NW'];
  const index = Math.round(deg / 45) % 8;
  compass.textContent = dirs[index];
}

// ==================== 场景管理 ====================
function initScenes() {
  // 从 localStorage 恢复
  const saved = localStorage.getItem('panorama_scenes');
  if (saved) {
    try {
      APP.scenes = JSON.parse(saved);
    } catch(e) {
      APP.scenes = [...DEMO_SCENES];
    }
  } else {
    APP.scenes = [...DEMO_SCENES];
  }

  // 恢复音乐列表
  const savedMusic = localStorage.getItem('panorama_music');
  if (savedMusic) {
    try { APP.musicPlaylist = JSON.parse(savedMusic); } catch(e) {}
  }

  updateSceneList();
  updateAdminSceneList();
  updateMusicList();
  updateMap();

  if (APP.scenes.length > 0) {
    loadPanorama(APP.scenes[0]);
  }
}

function saveScenes() {
  try {
    localStorage.setItem('panorama_scenes', JSON.stringify(APP.scenes));
  } catch(e) { console.warn('存储场景失败:', e); }
}

function saveMusic() {
  try {
    localStorage.setItem('panorama_music', JSON.stringify(APP.musicPlaylist));
  } catch(e) { console.warn('存储音乐失败:', e); }
}

function addScene(name, description, imageUrl, thumbUrl) {
  const id = 'scene_' + Date.now() + '_' + Math.random().toString(36).substr(2, 6);
  const scene = {
    id, name: name || '未命名场景',
    description: description || '',
    imageUrl: imageUrl || '',
    thumbUrl: thumbUrl || imageUrl || '',
    position: { x: 30 + Math.random() * 200, y: 20 + Math.random() * 120 },
  };
  APP.scenes.push(scene);
  saveScenes();
  updateSceneList();
  updateAdminSceneList();
  updateMap();
  showToast('已添加场景: ' + scene.name);
  return scene;
}

function removeScene(id) {
  const idx = APP.scenes.findIndex(s => s.id === id);
  if (idx === -1) return;
  const name = APP.scenes[idx].name;
  APP.scenes.splice(idx, 1);

  if (APP.currentSceneIndex >= APP.scenes.length) {
    APP.currentSceneIndex = Math.max(0, APP.scenes.length - 1);
  }

  saveScenes();
  updateSceneList();
  updateAdminSceneList();
  updateMap();

  if (APP.scenes.length > 0) {
    loadPanorama(APP.scenes[APP.currentSceneIndex]);
  }
  showToast('已删除场景: ' + name);
}

function switchScene(index) {
  if (index < 0 || index >= APP.scenes.length) return;
  APP.currentSceneIndex = index;
  loadPanorama(APP.scenes[index]);
  updateSceneList();
}

function prevScene() {
  if (APP.scenes.length === 0) return;
  APP.currentSceneIndex = (APP.currentSceneIndex - 1 + APP.scenes.length) % APP.scenes.length;
  switchScene(APP.currentSceneIndex);
}

function nextScene() {
  if (APP.scenes.length === 0) return;
  APP.currentSceneIndex = (APP.currentSceneIndex + 1) % APP.scenes.length;
  switchScene(APP.currentSceneIndex);
}

function resetView() {
  APP.lon = 0; APP.lat = 0; APP.fov = 75;
  camera.fov = 75;
  camera.updateProjectionMatrix();
  showToast('视角已重置');
}

// ==================== UI 更新 ====================
function updateSceneList() {
  const list = document.getElementById('sceneList');
  if (APP.scenes.length === 0) {
    list.innerHTML = '<div style="text-align:center;padding:40px;color:var(--text-dim);font-size:13px;">暂无场景<br><small>点击"管理"添加全景图</small></div>';
    return;
  }

  list.innerHTML = APP.scenes.map((s, i) => `
    <div class="scene-item ${i === APP.currentSceneIndex ? 'active' : ''}" onclick="switchScene(${i}); toggleSidebar();">
      ${s.thumbUrl ? `<img class="scene-thumb" src="${s.thumbUrl}" alt="${s.name}">` :
        `<div class="scene-thumb" style="display:flex;align-items:center;justify-content:center;font-size:24px;background:linear-gradient(135deg,${['#1a3a5c','#2d1b4e','#0a2a3c','#3a1a2c'][i%4]},${['#f0a050','#e74c5e','#45c77b','#f0c050'][i%4]});">&#127912;</div>`}
      <div class="scene-info">
        <h4>${s.name}</h4>
        <p>${s.description || '暂无描述'}</p>
      </div>
      <button class="scene-delete" onclick="event.stopPropagation(); removeScene('${s.id}')" title="删除">&#10005;</button>
    </div>
  `).join('');
}

function updateAdminSceneList() {
  const list = document.getElementById('adminSceneList');
  if (APP.scenes.length === 0) {
    list.innerHTML = '<div style="text-align:center;padding:20px;color:var(--text-dim);">暂无场景，请上传全景图</div>';
    return;
  }

  list.innerHTML = APP.scenes.map((s, i) => `
    <div class="admin-scene-card">
      ${s.thumbUrl ? `<img src="${s.thumbUrl}" alt="${s.name}">` :
        `<div style="width:80px;height:80px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:32px;background:linear-gradient(135deg,#1a3a5c,#f0a050);">&#127912;</div>`}
      <div class="info">
        <h4>${s.name}</h4>
        <p>${s.description || '暂无描述'}</p>
        <p style="font-size:11px;color:var(--text-dim);margin-top:4px;">ID: ${s.id}</p>
      </div>
      <div class="actions">
        <button class="btn btn-ghost" onclick="editSceneInAdmin('${s.id}')" style="padding:6px 12px;font-size:12px;">&#9998; 编辑</button>
        <button class="btn btn-danger" onclick="removeScene('${s.id}')" style="padding:6px 12px;font-size:12px;">&#128465; 删除</button>
      </div>
    </div>
  `).join('');
}

function updateInfo() {
  const s = APP.scenes[APP.currentSceneIndex];
  if (!s) return;
  document.getElementById('infoPanelTitle').textContent = s.name;
  document.getElementById('infoPanelBody').innerHTML = `
    <p>${s.description || '暂无简介信息'}</p>
    <div style="margin-top:16px;padding-top:12px;border-top:1px solid var(--border);">
      <div style="font-size:11px;color:var(--text-dim);">
        场景 ${APP.currentSceneIndex + 1} / ${APP.scenes.length} &nbsp;|&nbsp;
        FOV: ${Math.round(APP.fov)}°
      </div>
    </div>
  `;
}

// ==================== 地图 ====================
function updateMap() {
  const svg = document.getElementById('mapSvg');
  let svgContent = `<rect width="260" height="160" fill="#1a1f2e"/>`;

  // 网格
  svgContent += `<g stroke="rgba(255,255,255,0.05)" stroke-width="0.5">`;
  for (let i = 0; i <= 260; i += 26) svgContent += `<line x1="${i}" y1="0" x2="${i}" y2="160"/>`;
  for (let j = 0; j <= 160; j += 20) svgContent += `<line x1="0" y1="${j}" x2="260" y2="${j}"/>`;
  svgContent += `</g>`;

  // 连线
  APP.scenes.forEach((s, i) => {
    const next = APP.scenes[(i + 1) % APP.scenes.length];
    if (next && APP.scenes.length > 1) {
      svgContent += `<line x1="${s.position.x}" y1="${s.position.y}" x2="${next.position.x}" y2="${next.position.y}" stroke="rgba(92,186,239,0.2)" stroke-width="1" stroke-dasharray="4,4"/>`;
    }
  });

  // 场景点
  APP.scenes.forEach((s, i) => {
    const isActive = i === APP.currentSceneIndex;
    const color = isActive ? '#5cbaef' : 'rgba(92,186,239,0.5)';
    const r = isActive ? 8 : 5;
    svgContent += `
      <circle cx="${s.position.x}" cy="${s.position.y}" r="${r + 4}" fill="${isActive ? 'rgba(92,186,239,0.15)' : 'transparent'}" style="cursor:pointer" onclick="switchScene(${i})"/>
      <circle cx="${s.position.x}" cy="${s.position.y}" r="${r}" fill="${color}" style="cursor:pointer" onclick="switchScene(${i})">
        ${isActive ? '<animate attributeName="r" values="8;11;8" dur="2s" repeatCount="indefinite"/>' : ''}
      </circle>
      <text x="${s.position.x}" y="${s.position.y - r - 4}" text-anchor="middle" fill="rgba(255,255,255,0.7)" font-size="9" font-family="Microsoft YaHei">${s.name}</text>
    `;
  });

  svg.innerHTML = svgContent;
}

// ==================== 面板切换 ====================
function toggleSidebar() {
  APP.sidebarOpen = !APP.sidebarOpen;
  document.getElementById('sceneSidebar').classList.toggle('open', APP.sidebarOpen);
  document.getElementById('sidebarOverlay').classList.toggle('open', APP.sidebarOpen);
}

function toggleInfo() {
  APP.infoPanelOpen = !APP.infoPanelOpen;
  document.getElementById('infoPanel').classList.toggle('open', APP.infoPanelOpen);
  if (APP.infoPanelOpen) updateInfo();
}

function toggleMap() {
  APP.mapPanelOpen = !APP.mapPanelOpen;
  document.getElementById('mapPanel').classList.toggle('open', APP.mapPanelOpen);
  if (APP.mapPanelOpen) updateMap();
}

function toggleAutoRotate() {
  APP.autoRotate = !APP.autoRotate;
  const btn = document.getElementById('btnAutoRotate');
  btn.style.color = APP.autoRotate ? 'var(--accent)' : '';
  showToast(APP.autoRotate ? '自动旋转已开启' : '自动旋转已关闭');
}

function toggleFullscreen() {
  if (!document.fullscreenElement) {
    document.documentElement.requestFullscreen().catch(() => {});
    showToast('已进入全屏');
  } else {
    document.exitFullscreen();
    showToast('已退出全屏');
  }
}

function closeAllPanels() {
  if (APP.sidebarOpen) toggleSidebar();
  if (APP.infoPanelOpen) toggleInfo();
  if (APP.mapPanelOpen) toggleMap();
  if (APP.musicPlayerOpen) toggleMusicPlayer();
  closeAdmin();
  closeShare();
}

// ==================== 音乐播放器 ====================
function initAudio() {
  APP.audioElement = new Audio();
  APP.audioElement.volume = 0.6;

  APP.audioElement.addEventListener('timeupdate', () => {
    if (APP.audioElement.duration) {
      const pct = (APP.audioElement.currentTime / APP.audioElement.duration) * 100;
      document.getElementById('musicProgressFill').style.width = pct + '%';
    }
  });

  APP.audioElement.addEventListener('ended', () => {
    musicNext();
  });
}

function toggleMusic() {
  APP.musicPlayerOpen = !APP.musicPlayerOpen;
  document.getElementById('musicPlayer').classList.toggle('open', APP.musicPlayerOpen);
}

function toggleMusicPlayer() {
  toggleMusic();
}

function musicPlayPause() {
  if (APP.musicPlaylist.length === 0) {
    showToast('请先添加音乐文件');
    return;
  }
  if (APP.isMusicPlaying) {
    APP.audioElement.pause();
    APP.isMusicPlaying = false;
    document.getElementById('btnMusicPlay').innerHTML = '&#9654;';
  } else {
    if (!APP.audioElement.src && APP.musicPlaylist.length > 0) {
      playMusicByIndex(APP.currentMusicIndex);
    } else {
      APP.audioElement.play();
    }
    APP.isMusicPlaying = true;
    document.getElementById('btnMusicPlay').innerHTML = '&#9646;&#9646;';
  }
}

function playMusicByIndex(index) {
  if (index < 0 || index >= APP.musicPlaylist.length) return;
  APP.currentMusicIndex = index;
  const track = APP.musicPlaylist[index];
  APP.audioElement.src = track.url;
  APP.audioElement.play().then(() => {
    APP.isMusicPlaying = true;
    document.getElementById('btnMusicPlay').innerHTML = '&#9646;&#9646;';
  }).catch(() => {
    showToast('音乐播放失败');
  });
  document.getElementById('musicTrackName').textContent = track.name;
}

function musicPrev() {
  if (APP.musicPlaylist.length === 0) return;
  APP.currentMusicIndex = (APP.currentMusicIndex - 1 + APP.musicPlaylist.length) % APP.musicPlaylist.length;
  playMusicByIndex(APP.currentMusicIndex);
}

function musicNext() {
  if (APP.musicPlaylist.length === 0) return;
  APP.currentMusicIndex = (APP.currentMusicIndex + 1) % APP.musicPlaylist.length;
  playMusicByIndex(APP.currentMusicIndex);
}

function musicSeek(e) {
  const rect = e.target.getBoundingClientRect();
  const pct = (e.clientX - rect.left) / rect.width;
  if (APP.audioElement.duration) {
    APP.audioElement.currentTime = pct * APP.audioElement.duration;
  }
}

function setVolume(val) {
  if (APP.audioElement) {
    APP.audioElement.volume = val / 100;
  }
}

function handleMusicSelect(e) {
  const files = e.target.files;
  for (const file of files) {
    const url = URL.createObjectURL(file);
    APP.musicPlaylist.push({ name: file.name.replace(/\.[^.]+$/, ''), url });
  }
  saveMusic();
  updateMusicList();
  showToast(`已添加 ${files.length} 首音乐`);
  e.target.value = '';
}

function updateMusicList() {
  const list = document.getElementById('musicList');
  if (APP.musicPlaylist.length === 0) {
    list.innerHTML = '<div style="font-size:12px;color:var(--text-dim);padding:8px;">暂无音乐，请上传音频文件</div>';
    return;
  }
  list.innerHTML = APP.musicPlaylist.map((m, i) => `
    <div style="display:flex;align-items:center;gap:10px;padding:8px 12px;border-radius:8px;background:rgba(255,255,255,0.03);border:1px solid var(--border);">
      <span style="font-size:16px;cursor:pointer;" onclick="playMusicByIndex(${i})">&#9654;</span>
      <span style="flex:1;font-size:13px;">${m.name}</span>
      <button class="btn btn-ghost" onclick="removeMusic(${i})" style="padding:4px 8px;font-size:11px;color:var(--danger);">&#10005;</button>
    </div>
  `).join('');
  document.getElementById('musicTrackName').textContent = APP.musicPlaylist[APP.currentMusicIndex]?.name || '未选择音乐';
}

function removeMusic(index) {
  APP.musicPlaylist.splice(index, 1);
  saveMusic();
  updateMusicList();
}

// ==================== 文件上传处理 ====================
function handleFileSelect(e) {
  const files = e.target.files;
  for (const file of files) {
    processImageFile(file);
  }
  e.target.value = '';
}

function processImageFile(file) {
  const reader = new FileReader();
  reader.onload = (e) => {
    const dataUrl = e.target.result;
    const name = file.name.replace(/\.[^.]+$/, '');
    addScene(name, '', dataUrl, dataUrl);
  };
  reader.readAsDataURL(file);
}

// 拖拽上传
function initDragDrop() {
  const zone = document.getElementById('uploadZone');

  zone.addEventListener('dragover', (e) => {
    e.preventDefault();
    zone.classList.add('dragover');
  });

  zone.addEventListener('dragleave', () => {
    zone.classList.remove('dragover');
  });

  zone.addEventListener('drop', (e) => {
    e.preventDefault();
    zone.classList.remove('dragover');
    for (const file of e.dataTransfer.files) {
      if (file.type.startsWith('image/')) {
        processImageFile(file);
      }
    }
  });

  // 全局拖拽（非管理面板打开时也可拖入）
  document.body.addEventListener('dragover', (e) => e.preventDefault());
  document.body.addEventListener('drop', (e) => {
    e.preventDefault();
    for (const file of e.dataTransfer.files) {
      if (file.type.startsWith('image/')) {
        processImageFile(file);
        openAdmin();
      }
    }
  });
}

// ==================== 编辑场景 ====================
function editSceneInAdmin(id) {
  const s = APP.scenes.find(s => s.id === id);
  if (!s) return;

  const overlay = document.getElementById('adminOverlay');
  const body = overlay.querySelector('.admin-body');

  // 创建编辑表单
  const editForm = document.createElement('div');
  editForm.style.cssText = 'padding:20px;background:rgba(92,186,239,0.08);border-radius:12px;border:1px solid var(--accent);margin-bottom:20px;';
  editForm.innerHTML = `
    <h3 style="font-size:14px;margin-bottom:16px;color:var(--accent);">&#9998; 编辑场景: ${s.name}</h3>
    <div class="info-field">
      <label>场景名称</label>
      <input type="text" id="editName" value="${s.name}">
    </div>
    <div class="info-field">
      <label>场景描述</label>
      <textarea id="editDesc">${s.description || ''}</textarea>
    </div>
    <div class="info-field">
      <label>全景图URL（可选，留空使用程序生成图）</label>
      <input type="text" id="editUrl" value="${s.imageUrl}" placeholder="输入在线全景图地址">
    </div>
    <div style="display:flex;gap:10px;margin-top:12px;">
      <button class="btn btn-primary" onclick="saveSceneEdit('${id}')" style="padding:8px 20px;">保存</button>
      <button class="btn btn-ghost" onclick="this.parentElement.parentElement.remove()" style="padding:8px 20px;">取消</button>
    </div>
  `;

  body.insertBefore(editForm, body.firstChild);
  editForm.scrollIntoView({ behavior: 'smooth' });
}

function saveSceneEdit(id) {
  const s = APP.scenes.find(s => s.id === id);
  if (!s) return;

  const name = document.getElementById('editName').value.trim();
  const desc = document.getElementById('editDesc').value.trim();
  const url = document.getElementById('editUrl').value.trim();

  if (name) s.name = name;
  s.description = desc;
  if (url) {
    s.imageUrl = url;
    s.thumbUrl = url;
  }

  saveScenes();
  updateSceneList();
  updateAdminSceneList();
  updateMap();

  // 移除编辑表单
  document.querySelector('.admin-body > div:first-child')?.remove();

  // 如果是当前场景则重新加载
  if (APP.scenes[APP.currentSceneIndex]?.id === id) {
    loadPanorama(s);
  }

  showToast('场景已更新');
}

// ==================== 后台管理面板 ====================
function openAdmin() {
  document.getElementById('adminOverlay').classList.add('open');
  updateAdminSceneList();
  updateMusicList();
}

function closeAdmin() {
  document.getElementById('adminOverlay').classList.remove('open');
}

// ==================== 分享功能 ====================
function openShare() {
  document.getElementById('shareModal').classList.add('open');
  const currentScene = APP.scenes[APP.currentSceneIndex];
  const shareUrl = window.location.href + (currentScene ? '#scene=' + currentScene.id : '');
  document.getElementById('shareLink').value = shareUrl;
}

function closeShare() {
  document.getElementById('shareModal').classList.remove('open');
}

function copyShareLink() {
  const input = document.getElementById('shareLink');
  input.select();
  navigator.clipboard?.writeText(input.value).then(() => {
    showToast('链接已复制到剪贴板');
  }).catch(() => {
    document.execCommand('copy');
    showToast('链接已复制');
  });
}

function shareToWechat() {
  copyShareLink();
  showToast('链接已复制，请粘贴到微信中分享');
}

function shareToWeibo() {
  const currentScene = APP.scenes[APP.currentSceneIndex];
  const text = `我正在浏览720°全景：${currentScene?.name || '全景漫游'}，快来看看吧！`;
  const url = `https://service.weibo.com/share/share.php?title=${encodeURIComponent(text)}&url=${encodeURIComponent(document.getElementById('shareLink').value)}`;
  window.open(url, '_blank', 'width=600,height=500');
}

function shareToQQ() {
  const currentScene = APP.scenes[APP.currentSceneIndex];
  const text = `我正在浏览720°全景：${currentScene?.name || '全景漫游'}，快来看看吧！`;
  const url = `https://connect.qq.com/widget/shareqq/index.html?title=${encodeURIComponent(text)}&url=${encodeURIComponent(document.getElementById('shareLink').value)}`;
  window.open(url, '_blank', 'width=600,height=500');
}

// ==================== Toast 提示 ====================
function showToast(msg) {
  const toast = document.getElementById('toast');
  toast.textContent = msg;
  toast.classList.add('show');
  clearTimeout(toast._timer);
  toast._timer = setTimeout(() => toast.classList.remove('show'), 2500);
}

// ==================== URL 参数处理 ====================
function handleUrlParams() {
  const hash = window.location.hash;
  if (hash.startsWith('#scene=')) {
    const sceneId = hash.replace('#scene=', '');
    const idx = APP.scenes.findIndex(s => s.id === sceneId);
    if (idx !== -1) {
      APP.currentSceneIndex = idx;
      loadPanorama(APP.scenes[idx]);
    }
  }
}

// ==================== 初始化 ====================
window.addEventListener('DOMContentLoaded', () => {
  initPanorama();
  initAudio();
  initScenes();
  initDragDrop();
  handleUrlParams();

  // 自动旋转按钮初始状态
  document.getElementById('btnAutoRotate').style.color = 'var(--accent)';

  // 欢迎提示
  setTimeout(() => showToast('拖拽鼠标可旋转视角，滚轮缩放'), 1500);
});
</script>
</body>
